name: Foundation checks
on: [push, pull_request]
jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sih_test
          POSTGRES_USER: sih_test
          POSTGRES_PASSWORD: ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sih_test -d sih_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+psycopg://sih_test:ci_only@localhost:5432/sih_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest -q
        working-directory: backend
      - run: |
          alembic upgrade head
          python -m app.seed
          alembic check
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/sih-api.log 2>&1 &
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://sih_test:ci_only@localhost:5432/sih_test
      - run: npm ci
        working-directory: frontend
      - run: npm run build && npm run lint
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
      - run: docker compose config --quiet
