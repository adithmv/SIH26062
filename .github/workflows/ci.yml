name: Mission workflow checks
on: [push, pull_request]
jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sih_test
          POSTGRES_USER: sih_test
          POSTGRES_PASSWORD: ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sih_test -d sih_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+psycopg://sih_test:ci_only@localhost:5432/sih_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest -q
        working-directory: backend
      - run: |
          alembic upgrade head
          python -m tests.fixtures_data
          alembic check
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/sih-api.log 2>&1 &
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://sih_test:ci_only@localhost:5432/sih_test
      - run: npm ci
        working-directory: frontend
      - run: npm run build && npm run lint
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
      - run: docker compose config --quiet
      - name: Validate base deployment configuration
        run: |
          docker compose -f compose.base.yaml config --quiet
          docker compose -f compose.base.yaml -f compose.base.lan.yaml config --quiet
        env:
          BASE_HOST: localhost
          BASE_DB_PASSWORD: ci_configuration_only
      - name: Build base deployment images
        run: docker compose -f compose.base.yaml build
        env:
          BASE_HOST: localhost
          BASE_DB_PASSWORD: ci_configuration_only
      - name: Check base startup and authentication boundary
        run: |
          docker compose -f compose.base.yaml up -d --wait --wait-timeout 120
          # Only this disposable localhost check uses its temporary, untrusted certificate.
          curl --retry 10 --retry-connrefused --retry-delay 2 --insecure --fail https://localhost/api/health
          test "$(curl --insecure --silent --output /tmp/base-denied.json --write-out '%{http_code}' https://localhost/api/missions)" = 401
          curl --insecure --silent --fail https://localhost/api/auth/session | python -c 'import json,sys; assert json.load(sys.stdin) == {"mode":"base", "user":None}'
        env:
          BASE_HOST: localhost
          BASE_DB_PASSWORD: ci_configuration_only
      - name: Show base container logs on failure
        if: failure()
        run: docker compose -f compose.base.yaml logs --tail 100
        env:
          BASE_HOST: localhost
          BASE_DB_PASSWORD: ci_configuration_only
      - name: Remove disposable base test containers
        if: always()
        run: docker compose -f compose.base.yaml down --volumes
        env:
          BASE_HOST: localhost
          BASE_DB_PASSWORD: ci_configuration_only
